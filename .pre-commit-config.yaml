repos:
  # =========================
  # Ruff - Linting & Formatting
  # =========================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]

      - id: ruff-format

  # =========================
  # Pyright - Type Checking
  # =========================
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.350
    hooks:
      - id: pyright

  # =========================
  # Detect Secrets
  # =========================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
